<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOOTAWALAA — Imported Shahganj</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f6f6;color:#111}
header{background:#050505;color:#f5cf3d;padding:10px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:62px;height:62px;object-fit:contain;border-radius:50%}
.brand b{font-size:24px;letter-spacing:2px}.brand small{display:block;color:#aaa;letter-spacing:2px;font-size:10px}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.gold{background:#f5cf3d;color:#111}.dark{background:#111;color:#fff}
.hero{background:#080808;color:#fff;padding:55px 6%;display:flex;align-items:center;justify-content:space-between;gap:25px}
.hero h1{font-size:48px;margin:0 0 10px}.hero p{color:#ccc;font-size:17px}.hero img{width:220px;height:220px;object-fit:contain;border-radius:50%}
.ownerbar{display:none;background:#181818;color:white;padding:14px 6%;justify-content:space-between;align-items:center;gap:10px}.ownerbar.show{display:flex}
.wrap{padding:38px 6%}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.search{width:280px;padding:12px 14px;border:1px solid #ddd;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:22px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #00000012}.photo{height:230px;background:#eee;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:75px}.info{padding:16px}
.price{font-size:21px;font-weight:800}.sizes{color:#666;font-size:13px;margin:8px 0}.card button{width:100%;margin-top:8px}
.empty{grid-column:1/-1;text-align:center;padding:45px;color:#777}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal.show{display:flex}
.box{background:#fff;border-radius:16px;padding:25px;width:min(600px,100%);max-height:90vh;overflow:auto}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
.field input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{background:#050505;color:#aaa;padding:28px 6%;margin-top:30px}
@media(max-width:650px){.brand b{font-size:18px}.brand img{width:50px;height:50px}.hero h1{font-size:35px}.hero img{width:135px;height:135px}.row{grid-template-columns:1fr}}
</style>
</head>

<div class="ownerbar" id="ownerbar">
  <b>OWNER MODE</b>
  <div>
    <button class="gold" onclick="openProduct()">＋ Add Shoe</button>
    <button style="background:#fff" onclick="logout()">Logout</button>
  </div>
</div>

<main class="wrap" id="shop">
  <div class="toolbar">
    <h2>Our Shoes</h2>
    <input class="search" id="search" placeholder="Search shoes..." oninput="render()">
    <select class="search" id="categoryFilter" onchange="render()">
      <option value="">All Types</option>
      <option>Sport Shoes</option><option>Sneakers</option><option>Leather Shoes</option>
      <option>Boots</option><option>Casual Shoes</option><option>Formal Shoes</option>
      <option>Running Shoes</option><option>Loafers</option><option>Sandals</option>
      <option>Slippers</option><option>Other</option>
    </select>
  </div>
  <div class="grid" id="products"></div>
</main>

<footer>© 2026 JOOTAWALAA — Imported Shahganj</footer>

<div class="modal" id="loginModal">
  <div class="box">
    <h2>Owner Login</h2>
    <div class="field"><label>Mobile / Username</label><input id="loginUser"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password"></div>
    <button class="gold" style="width:100%" onclick="login()">Login</button>
    <p id="loginMsg"></p>
    <button class="dark" style="width:100%;margin-top:8px" onclick="closeModal('loginModal')">Close</button>
  </div>
</div>

<div class="modal" id="productModal">
  <div class="box">
    <h2 id="formTitle">Add Shoe</h2>
    <input id="editId" type="hidden">
    <div class="field"><label>Shoe Name</label><input id="pName" placeholder="e.g. Air Runner"></div>
    <div class="field"><label>Shoe Type</label>
      <select id="pCategory" style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px">
        <option value="">Select shoe type</option>
        <option>Sport Shoes</option><option>Sneakers</option><option>Leather Shoes</option>
        <option>Boots</option><option>Casual Shoes</option><option>Formal Shoes</option>
        <option>Running Shoes</option><option>Loafers</option><option>Sandals</option>
        <option>Slippers</option><option>Other</option>
      </select>
    </div>
    <div class="row">
      <div class="field"><label>Price (₹)</label><input id="pPrice" type="number" min="0"></div>
      <div class="field"><label>Sizes</label><input id="pSizes" placeholder="6, 7, 8, 9, 10"></div>
    </div>
    <div class="field"><label>Shoe Photo</label><input id="pPhoto" type="file" accept="image/*"></div>
    <div id="preview"></div>
    <button class="gold" style="width:100%;margin-top:12px" onclick="saveProduct()">Save Shoe</button>
    <button class="dark" style="width:100%;margin-top:8px" onclick="closeModal('productModal')">Cancel</button>
  </div>
</div>

<script>
const SUPABASE_URL="https://yfvavbeorkkgdojnmvqs.supabase.co";
const SUPABASE_KEY="sb_publishable_BPUCwfe4vx-TaZSFHgiVGQ_QfKPN6nA";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET="shoe-images";
let products=[],editingId=null,currentPhotoUrl="";

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]) )}
function isOwner(){return sessionStorage.getItem("jootawalaa_owner")==="1"}
function openLogin(){document.getElementById("loginModal").classList.add("show")}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function setOwner(){document.getElementById("ownerbar").classList.toggle("show",isOwner());render()}
function logout(){sessionStorage.removeItem("jootawalaa_owner");setOwner()}

function login(){
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPass").value;
  const msg=document.getElementById("loginMsg");
  if(u==="6388911398" && p==="Kafeel@321"){
    sessionStorage.setItem("jootawalaa_owner","1");
    closeModal("loginModal"); msg.textContent=""; setOwner();
  } else {msg.style.color="crimson";msg.textContent="Invalid username or password."}
}

async function loadProducts(){
  const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});
  if(error){
    console.error(error);
    document.getElementById("products").innerHTML='<div class="empty">Products load nahi ho rahe. Supabase table/RLS check karein.</div>';
    return;
  }
  products=data||[]; render();
}

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const cat=document.getElementById("categoryFilter").value;
  const list=products.filter(p=>
    (p.name+" "+(p.sizes||"")+" "+(p.category||"")).toLowerCase().includes(q) &&
    (!cat || p.category===cat)
  );
  const box=document.getElementById("products");
  if(!list.length){box.innerHTML='<div class="empty">No shoes added yet.</div>';return}
  box.innerHTML=list.map(p=>`
    <article class="card">
      <div class="photo">${p.photo_url?`<img src="${p.photo_url}" alt="${esc(p.name)}">`:'<div class="placeholder">👟</div>'}</div>
      <div class="info">
        <h3>${esc(p.name)}</h3>
        <div class="price">₹${Number(p.price).toLocaleString("en-IN")}</div>
        <div class="sizes">Sizes: ${esc(p.sizes||"—")}</div>
        <button class="gold" onclick="orderWhatsApp('${p.id}')">Order on WhatsApp</button>
        ${isOwner()?`<button class="dark" onclick="openProduct('${p.id}')">Edit</button>
        <button style="background:#eee" onclick="deleteProduct('${p.id}')">Delete</button>`:""}
      </div>
    </article>`).join("");
}

function orderWhatsApp(id){
  const p=products.find(x=>x.id===id); if(!p)return;
  const msg=`Hello Jootawalaa, I want to order this shoe.\n\nShoe: ${p.name}\nPrice: ₹${p.price}\nSize: ${p.sizes||"Please confirm"}\n\nPlease confirm availability and order details.`;
  window.open("https://wa.me/916388911398?text="+encodeURIComponent(msg),"_blank");
}

function openProduct(id=null){
  if(!isOwner())return openLogin();
  editingId=id; currentPhotoUrl="";
  const p=products.find(x=>x.id===id);
  document.getElementById("formTitle").textContent=id?"Edit Shoe":"Add Shoe";
  document.getElementById("pName").value=p?.name||"";
  document.getElementById("pCategory").value=p?.category||"";
  document.getElementById("pPrice").value=p?.price||"";
  document.getElementById("pSizes").value=p?.sizes||"";
  document.getElementById("pPhoto").value="";
  currentPhotoUrl=p?.photo_url||"";
  document.getElementById("preview").innerHTML=p?.photo_url?`<img src="${p.photo_url}" style="max-width:180px;max-height:140px;border-radius:8px">`:"";
  document.getElementById("productModal").classList.add("show");
}

document.getElementById("pPhoto").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>document.getElementById("preview").innerHTML=`<img src="${r.result}" style="max-width:180px;max-height:140px;border-radius:8px">`;
  r.readAsDataURL(f);
});

async function saveProduct(){
  if(!isOwner())return;
  const name=document.getElementById("pName").value.trim();
  const category=document.getElementById("pCategory").value;
  const price=document.getElementById("pPrice").value;
  const sizes=document.getElementById("pSizes").value.trim();
  const file=document.getElementById("pPhoto").files[0];
  if(!name||!price){alert("Shoe name aur price bharna zaroori hai.");return}
  let photoUrl=currentPhotoUrl||null;

  if(file){
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=Date.now()+"_"+safe;
    const up=await sb.storage.from(BUCKET).upload(path,file,{upsert:false});
    if(up.error){alert("Photo upload failed. Supabase me 'shoe-images' Public bucket check karein.");return}
    photoUrl=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  }

  let result;
  if(editingId) result=await sb.from("products").update({name,category,price:Number(price),sizes,photo_url:photoUrl}).eq("id",editingId);
  else result=await sb.from("products").insert({name,category,price:Number(price),sizes,photo_url:photoUrl});

  if(result.error){alert("Save failed: "+result.error.message);return}
  closeModal("productModal"); await loadProducts();
}

async function deleteProduct(id){
  if(!confirm("Delete this shoe?"))return;
  const {error}=await sb.from("products").delete().eq("id",id);
  if(error)alert(error.message); else loadProducts();
}

setOwner(); loadProducts();
</script>
</body>
</html>
